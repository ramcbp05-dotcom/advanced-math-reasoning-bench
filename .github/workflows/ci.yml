name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    name: problem-collection integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  verify:
    name: verification scripts (${{ matrix.area }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [conditioning, eigenvalue-sensitivity, ode-stability]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run every verification script in ${{ matrix.area }}
        run: |
          python -m bench.cli verify -a ${{ matrix.area }} --verbose \
            --report results/ci-${{ matrix.area }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.area }}
          path: results/
          retention-days: 14

  installed-cli:
    name: installed CLI outside checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Exercise installed package and bundled data
        run: |
          cd "$(mktemp -d)"
          mathbench list
          mathbench verify
